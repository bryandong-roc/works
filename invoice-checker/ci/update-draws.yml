# 啟用方式：將本檔複製到 repo 根目錄的 .github/workflows/invoice-checker-update.yml
# （GitHub 只會讀取該位置，這是本專案唯一需要放在子資料夾之外的檔案）
name: invoice-checker-update-draws
on:
  schedule:
    - cron: '30 6 25-28 1,3,5,7,9,11 *'   # 開獎月 25–28 日，台北時間 14:30（UTC 06:30）
    - cron: '0 2 * * 1'                   # 每週一補抓
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: invoice-checker-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invoice-checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - run: node scripts/fetch-draws.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          git diff --cached --quiet || (git commit -m "chore(invoice-checker): update draws" && git push)
